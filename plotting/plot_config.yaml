# Plot configuration for publication_plots_main.py
# Avoids re-entering parameters interactively each run.
# File paths are relative to model_output/

# STALE, and not a paper figure any more: the manuscript uses the _ensemble variants
# below. Kept for ad-hoc single-run inspection only; the pkls are pre-rho-fix, pre-kappa.
network_agency_evolution:
  big_n:
    file: trajectory_analysis_twin_20260402.pkl
    truncate_steps: null        # null = full run
    analysis_t_end: 139000       # ensemble-median logistic 95% t_end
  small_n:
    file: trajectory_analysis_sample-max_20260413.pkl
    truncate_steps: null        # null = full run
    mid_t: null                 # null = auto (trajectory midpoint); int = target timestep
    analysis_t_end: null        # null = auto-steady; int = explicit timestep for network t_end
  rescale:
    reference_fveg: 0.5         # F_veg crossing to align trajectories at (null = no rescaling)
  savgol_window: 10001          # Savitzky-Golay window for tipping point detection

# STALE, single-run, not a paper figure. See the note above.
amplification:
  file: trajectory_analysis_twin_20260317.pkl
  analysis_t_end: 139000        # ensemble-median logistic 95% t_end

# SUPERSEDED 2026-09-07. Fig. 3 (agency_two_dvs.pdf) is now built on the primary ledger,
# which only exists as an offline replay, so it comes from the per-run CSV rather than a
# pkl snapshot:
#   python agency_predictor_analysis.py --from-csv \
#     ../model_output/trajectory_analysis_twin_20260903_kappa0p55_N2000_reduced/two_dv_primary.csv
# That also writes the SI S1-S3 table bodies. This block drives the old in-run-ledger
# figure only; do not use it for the paper.
agency_predictors:
  file: trajectory_analysis_twin_20260317.pkl
  analysis_t_end: 139000        # ensemble-median logistic 95% t_end

network_agency_evolution_ensemble:
  big_n:
    file: trajectory_analysis_twin_20260903_kappa0p55_N2000.pkl
    truncate_steps: 350000      # display window in STEPS; every run's t_90 <= 347.7k
    analysis_t_end: 310000      # ensemble-median logistic 95% t_end (IQR [290.9k,339.6k])
  small_n:
    # Network panels only. Both times are SMALL-N snapshots chosen so that, under the
    # F_veg=0.5 rescaling (scale_factor 5.575), they land on the big-N times that matter:
    #   30000 -> ~167k, F_veg 0.366: first snapshot past the ensemble F_c (0.35); 28000 is
    #            0.325. Was 38000 (the F_veg=0.5 crossing, the rescale anchor) to 2026-09-10.
    #   56000 -> 312.2k, the big-N analysis window (310000)
    file: trajectory_sample-max_20260903_kappa0p55_100k.pkl
    mid_t: 30000
    analysis_t_end: 56000
  rescale:
    reference_fveg: 0.5
  savgol_window: 80001         # 20% of the 400k run: tightest per-seed F_c IQR
                               # (0.086 vs 0.121 at 10001), median window-stable.
                               # Matches the window the SI quotes F_c at.
  # Reported ledger for panels B/C and the network highlighting (2026-09-10): veg-time
  # vegtime_A_run_XX.npz at t = 310000: B = (1 + A) x 664 kg, t CO2e per year the agent
  # is vegetarian (no calendar anchor); C = total credit; the network row replays the
  # small-N event log at each snapshot, nodes ranked on own + downstream (as B's
  # 1 + A), its box = the top reducer's cumulative total in t to that snapshot at the central 0.665 yr/sweep. Unset = the pkl's
  # `reductions`, the submitted in-run ledger.
  credit_dir: trajectory_analysis_twin_20260903_kappa0p55_N2000_reduced

amplification_ensemble:
  file: trajectory_analysis_twin_20260903_kappa0p55_N2000.pkl
  analysis_t_end: 310000        # ensemble-median logistic 95% t_end (IQR [290.9k,339.6k])
  # Reported ledger since 2026-09-09: veg-time (exposure parents, no dwell, lambda 0.7),
  # A_i = credited vegetarian-time / own vegetarian-time at t = 310000. The per-run A
  # vectors come from analysis/vegtime_accounting.py (vegtime_A_run_XX.npz); with
  # multipliers_dir set the pkl (whose `reductions` is the submitted in-run ledger) is
  # not read. Record: claude_stuff/Review/amplification_accounting_final_2026-09-09.md.
  multipliers_dir: trajectory_analysis_twin_20260903_kappa0p55_N2000_reduced
